openapi: 3.0.0
info:
  title: User Service API
  version: 1.0.0
  description: API for managing users and leaderboard
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /createuser:
    post:
      summary: Creates a new user
      description: Creates a new user with the given username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  example: "testuser"
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Hello testuser! welcome to the course!"
        '400':
          description: Error creating user
  /finished-match:
    post:
      summary: Registers a finished match
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Match saved and score calculated
        '400':
          description: Validation error
        '401':
          description: Unauthorized
  /auth/refresh:
    post:
      summary: Rotate refresh token and return a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens rotated
        '401':
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      summary: Revoke a refresh token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Refresh session revoked
  /leaderboard:
    get:
      summary: Global leaderboard paginated
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            enum: [25, 50, 100]
            default: 25
      responses:
        '200':
          description: Leaderboard page
  /leaderboard/suggest:
    get:
      summary: User suggestions for search autocomplete
      parameters:
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: Suggestion list
  /users/resolve:
    get:
      summary: Resolve exact username (trim and case-insensitive)
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
        '404':
          description: User not found
  /users/{username}:
    get:
      summary: User profile with global position
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile
        '404':
          description: User not found
  /users/{username}/history:
    get:
      summary: User match history (1vsbot) paginated
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            enum: [25, 50, 100]
            default: 25
      responses:
        '200':
          description: User history page
        '404':
          description: User not found
  /users/{username}/centered-leaderboard:
    get:
      summary: Leaderboard centered on user position
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
            enum: [25, 50, 100]
            default: 25
      responses:
        '200':
          description: Centered leaderboard page
        '404':
          description: User not found
